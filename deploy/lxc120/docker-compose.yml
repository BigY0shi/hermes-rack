version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shared-db
    environment:
      POSTGRES_DB: agentstack
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: hermesagent
    volumes:
      - shared_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentstack"]
      interval: 10s
      timeout: 5s
      retries: 5

  agno:
    image: agno/agentos:latest
    container_name: agno
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agent:hermesagent@db:5432/agentstack
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    depends_on:
      db:
        condition: service_healthy
    environment:
      - FLOWISE_USERNAME=admin
      - FLOWISE_PASSWORD=Dlink2012
      - FLOWISE_SECRETKEY_OVERWRITE=CrwPnq48u4N0I3hhg8bZJWEP5CKR78GynALg3IGUt2XacE8NIAMiZiolG19GWK0a
      - DATABASE_TYPE=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=agent
      - DATABASE_PASSWORD=hermesagent
      - DATABASE_NAME=agentstack
      - CORS_ORIGINS=*
    ports:
      - "3000:3000"
    volumes:
      - flowise_data:/root/.flowise
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  shared_db:
  flowise_data:
